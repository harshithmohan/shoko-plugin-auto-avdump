name: Release Build

on:
  push:
    branches: ["main"]

concurrency:
  group: release
  cancel-in-progress: true

env:
  METADATA_BRANCH: metadata
  MANIFEST_PATH: manifest.json
  IDENTITY_MANIFEST: manifest.json
  ASSET_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Get new version
        uses: zwaldowski/semver-release-action@v6
        id: semver
        with:
          bump: patch
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true

      - name: Fetch the live manifest
        run: |
          git fetch --no-tags origin "+refs/heads/${METADATA_BRANCH}:refs/remotes/origin/${METADATA_BRANCH}"
          git show "origin/${METADATA_BRANCH}:${MANIFEST_PATH}" > "${IDENTITY_MANIFEST}"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.semver.outputs.version }}" \
            --title "v${{ steps.semver.outputs.version }}" \
            --generate-notes
          gh release view "v${{ steps.semver.outputs.version }}" \
            --json body --template '{{.body}}' > "${RUNNER_TEMP}/release-notes.md"

      - name: Restore the build tool
        run: dotnet tool restore

      - name: Build and package
        run: |
          dotnet shoko-build \
            --configuration Release \
            --channel Dev \
            --tag "v${{ steps.semver.outputs.version }}" \
            --prune 5 \
            --release-notes-path "${RUNNER_TEMP}/release-notes.md" \
            --manifest "${GITHUB_WORKSPACE}/${IDENTITY_MANIFEST}" \
            --output "${GITHUB_WORKSPACE}/dist/{name}-{tag}-{runtime}.zip" \
            --url "${ASSET_BASE_URL}/{tag}/{name}-{tag}-{runtime}.zip" \
            -- -p:Version=${{ steps.semver.outputs.version }} -p:RepositoryUrl=${{ github.server_url }}/${{ github.repository }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ steps.semver.outputs.version }}" \
            dist/*.zip \
            --repo "${{ github.repository }}"

      - name: Commit the manifest on the metadata branch
        run: |
          cp "${IDENTITY_MANIFEST}" "${RUNNER_TEMP}/manifest.json"
          git reset --hard
          git checkout -B "${METADATA_BRANCH}" "origin/${METADATA_BRANCH}"
          cp "${RUNNER_TEMP}/manifest.json" "${MANIFEST_PATH}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${MANIFEST_PATH}"
          if git diff --cached --quiet; then
            echo "Manifest unchanged; nothing to commit."
          else
            git commit -m "ci: update manifest for v${{ steps.semver.outputs.version }}"
            git push origin "${METADATA_BRANCH}"
          fi
